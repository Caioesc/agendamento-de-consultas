<div class="container">
    <mat-card>
        <div class="header-card">
            <h2>Pacientes</h2>
            <button mat-flat-button color="primary" routerLink="/novopaciente">
                <mat-icon>add</mat-icon> Novo Paciente
            </button>
        </div>

        <mat-card-content>
            <table mat-table [dataSource]="pacientes" class="mat-elevation-z8">

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef> Nome </th>
                    <td mat-cell *matCellDef="let paciente"> {{ paciente.nome }} </td>
                </ng-container>

                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef> E-mail </th>
                    <td mat-cell *matCellDef="let paciente"> {{ paciente.email }} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
                <tr mat-row *matRowDef="let row; columns: colunasExibidas;"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
